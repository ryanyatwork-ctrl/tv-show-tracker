      window.dataLayer = window.dataLayer || [];

      gtag('js', new Date());

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>TV Tracker</title>
    <meta name="description" content="Track your TV shows and episodes. No bloat, no algorithm. Just your shows and your progress." />

    <link rel="canonical" href="https://tvtracker.me/" />
    <meta property="og:title" content="TV Tracker" />
    <meta property="og:description" content="The no-nonsense TV show tracker you've been looking for." />
    <meta property="og:url" content="https://tvtracker.me/" />

    <!-- PWA iOS support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Tailwind CDN -->

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon">

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Register service worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW registered:', reg.scope))
            .catch(err => console.warn('SW registration failed:', err));
        });
      }
    </script>
  </body>
